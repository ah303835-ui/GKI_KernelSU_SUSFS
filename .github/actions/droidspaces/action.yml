name: Setup Droidspaces-OSS
description: Clone and apply Droidspaces-OSS patches with version-specific fixes
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  android_version:
    description: 'Android version (e.g., android15)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-07)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  droidspaces_commit:
    description: 'Pinned Droidspaces-OSS commit (empty = main tip)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download and Apply Droidspaces-OSS Patches
      uses: ./.github/actions/retry
      with:
        command: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git
        attempts: 5
        delay: 5
        workdir: ${{ github.workspace }}
        # A clone that dies mid-transfer leaves Droidspaces-OSS/ behind, and
        # the next attempt then fails instantly with "destination path already
        # exists" — so without this, all 5 attempts fail deterministically.
        cleanup: rm -rf Droidspaces-OSS

    - name: Pin Droidspaces-OSS to resolved commit
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ -n "${{ inputs.droidspaces_commit }}" ]; then
          git -C Droidspaces-OSS fetch --depth=1 origin "${{ inputs.droidspaces_commit }}"
          git -C Droidspaces-OSS checkout "${{ inputs.droidspaces_commit }}"
          [ "$(git -C Droidspaces-OSS rev-parse HEAD)" = "${{ inputs.droidspaces_commit }}" ] || { echo "Droidspaces pin mismatch" >&2; exit 1; }
        fi
    - name: Apply the SYSVIPC KABI fix
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        if [ "${{ inputs.version }}" == "android16-6.12" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-5.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch .
          patch -p1 < 001.GKI-6.12-or-above-fix_sysvipc_kabi.patch
        elif [ "${{ inputs.version }}" == "android15-6.6" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch .
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android14-6.1" ]; then
          curl -L https://raw.githubusercontent.com/ravindu644/DroidSpaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch -o patch.patch
          patch -p1 --fuzz=3 < patch.patch || true
          grep -q 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h || perl -0pi -e 's/\tANDROID_KABI_RESERVE\(6\);\n\tANDROID_KABI_RESERVE\(7\);\n\tANDROID_KABI_RESERVE\(8\);\n/#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif\n/' include/linux/sched.h || true
          grep -q 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h && echo "sched.h hunk OK" || echo "::warning::sched.h hunk NOT applied"
          echo '' | base64 -d | python3 - || true
          grep -q 'struct sysv_sem sysvsem' include/linux/sched.h && echo "sched.h hunk OK" || echo "::warning::sched.h hunk NOT applied"
          sed -i '1i static inline void hw_suppress_tag_checks_start(void) {}\nstatic inline void hw_suppress_tag_checks_stop(void) {}' mm/kasan/report.c || true
          grep -q 'shm_init_task' include/linux/shm.h || echo 'static inline void shm_init_task(struct task_struct *p) {}' >> include/linux/shm.h || true
          find . \( -name 'Makefile*' -o -name 'Kbuild*' \) -type f -exec sed -i -E 's/(^|[[:space:]])-Werror(=[A-Za-z0-9_-]+)?([[:space:]]|$)/\1\3/g' {} + || true
          echo 'KBUILD_CFLAGS += -Wno-error -Wno-error=array-bounds -Wno-error=stringop-overflow' >> Makefile
          echo "Remaining -Werror:"
          grep -rn --include='Makefile*' --include='Kbuild*' -e '-Werror' . | grep -v 'Wno-error' || echo none
        elif [ "${{ inputs.version }}" == "android14-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch .
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android13-5.15" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch .
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
        elif [ "${{ inputs.version }}" == "android12-5.10" ] || [ "${{ inputs.version }}" == "android13-5.10" ]; then
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch .
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          cp ${{ github.workspace }}/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch .
          patch -p1 < 002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
        fi
    - name: Export IPC symbols for module linkage
      shell: bash
      if: inputs.version == 'android16-6.12'
      working-directory: ${{ github.workspace }}/kernel
      run: |
        echo >> "${{ github.workspace }}/kernel/common/ipc/namespace.c"
        echo 'EXPORT_SYMBOL_GPL(put_ipc_ns);' >> "${{ github.workspace }}/kernel/common/ipc/namespace.c"
        echo >> "${{ github.workspace }}/kernel/common/ipc/msgutil.c"
        echo 'EXPORT_SYMBOL_GPL(init_ipc_ns);' >> "${{ github.workspace }}/kernel/common/ipc/msgutil.c"

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_PID_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_BINFMT_MISC=y
          CONFIG_BINFMT_SCRIPT=y
          CONFIG_BINFMT_ELF=y
          CONFIG_USER_NS=y

